name: Test Windows Install

on:
  workflow_dispatch:

jobs:
  windows-install-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Show environment
        run: |
          node --version
          echo "Platform: $env:OS"
          echo "Home: $env:USERPROFILE"

      - name: Create test project directory
        run: |
          mkdir $env:TEMP\test-project
          cd $env:TEMP\test-project
          git init

      - name: Run build-score init
        run: |
          cd $env:TEMP\test-project
          node $env:GITHUB_WORKSPACE\bin\build-score init

      - name: Verify init output
        run: |
          cd $env:TEMP\test-project
          echo "=== Directory structure ==="
          Get-ChildItem -Recurse -Name build-score
          echo ""
          echo "=== .claude/commands ==="
          Get-ChildItem -Recurse -Name .claude
          echo ""
          echo "=== requirements/ ==="
          Get-ChildItem -Recurse -Name requirements

      - name: Run build-score check
        run: |
          cd $env:TEMP\test-project
          node $env:GITHUB_WORKSPACE\bin\build-score check

      - name: Test path separator handling
        run: |
          node -e "const path = require('path'); console.log('path.sep:', JSON.stringify(path.sep)); console.log('path.join test:', path.join('build-score', 'rules', 'priority-score.md'))"

      - name: Test slugify with Windows-unsafe chars
        run: |
          node -e "const { slugify } = require('${{ github.workspace }}\src\brief-writer.js'.replace(/\\/g, '\\\\')); console.log('slugify test:', slugify('請求書の自動化 2024/04'))"

      - name: Test server startup (no claude CLI)
        run: |
          node -e "const http = require('http'); const path = require('path'); const fs = require('fs'); const htmlPath = path.join('${{ github.workspace }}'.replace(/\\/g, '/'), 'templates', 'web', 'index.html'); console.log('HTML path:', htmlPath); console.log('HTML exists:', fs.existsSync(htmlPath))"
